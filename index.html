<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลิ้มรสไทย — แนะนำอาหารไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;600;700&family=Taviraj:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-deep-forest: #00473c;
    --color-lime-glow: #e6ff55;
    --color-sage-mist: #d8e5d6;
    --color-warm-sand: #e8dcc6;
    --color-cream-canvas: #f4f3e7;
    --color-forest-shadow: #0e150e;
    --color-warm-gray: #8c8c82;
    --color-slate-gray: #555555;
    --font-display: 'Mitr', sans-serif;
    --font-accent: 'Taviraj', serif;
    --font-text: 'Mitr', sans-serif;
    --shadow-xl: rgba(14, 21, 14, 0.4) 3px 3px 32px -10px;
    --radius-buttons: 9999px;
    --radius-images: 20px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-cream-canvas);
    color: var(--color-forest-shadow);
    font-family: var(--font-text);
    line-height: 1.5;
  }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; }

  .site-nav {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 0;
  }
  .brand {
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--color-deep-forest);
  }

  header.hero {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 56px;
    text-align: center;
  }

  .eyebrow {
    display: block;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--color-deep-forest);
    margin-bottom: 16px;
  }

  header.hero h1 {
    font-size: clamp(2.4rem, 8vw, 4.5rem);
    line-height: 0.9;
    color: var(--color-forest-shadow);
  }

  header.hero p.subtitle {
    font-family: var(--font-accent);
    font-weight: 200;
    margin: 24px auto 32px;
    max-width: 560px;
    color: var(--color-forest-shadow);
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    letter-spacing: -0.01em;
  }

  .btn-cta {
    display: inline-block;
    font-family: var(--font-text);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.017em;
    color: var(--color-forest-shadow);
    background: var(--color-lime-glow);
    border: none;
    border-radius: var(--radius-buttons);
    padding: 16px 32px;
    cursor: pointer;
    box-shadow: var(--shadow-xl);
    transition: transform 0.15s ease;
  }
  .btn-cta:active { transform: translateY(2px); }
  .btn-cta:disabled { opacity: 0.6; cursor: default; }

  .reel {
    margin: 32px auto 0;
    max-width: 320px;
    background: var(--color-cream-canvas);
    border: 2px solid var(--color-deep-forest);
    border-radius: 24px;
    padding: 24px 16px;
    box-shadow: var(--shadow-xl);
    overflow: hidden;
  }
  .reel.hidden { display: none; }
  .reel-track { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .reel-emoji { font-size: 2.6rem; }
  .reel-name { font-size: 1.2rem; font-weight: 700; color: var(--color-forest-shadow); }
  .reel-caption { color: var(--color-deep-forest); font-size: 14px; margin-top: 8px; font-weight: 700; letter-spacing: 0.02em; }

  #resultCard.hidden { display: none; }
  #resultCard { margin: 32px auto 0; max-width: 360px; }

  .utility-band { background: var(--color-sage-mist); padding: 32px 24px 36px; }

  .search-wrap { display: flex; justify-content: center; max-width: 1200px; margin: 0 auto; }

  #searchInput {
    width: 100%;
    max-width: 420px;
    font-family: var(--font-text);
    font-size: 16px;
    padding: 12px 20px;
    border: 2px solid var(--color-warm-gray);
    border-radius: var(--radius-buttons);
    outline: none;
    background: var(--color-cream-canvas);
    color: var(--color-forest-shadow);
  }
  #searchInput:focus { border-color: var(--color-deep-forest); }
  #searchInput::placeholder { color: var(--color-slate-gray); }

  nav.tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 28px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 0 8px;
  }

  .tab {
    position: relative;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(20px, 3.4vw, 28px);
    background: none;
    border: none;
    color: var(--color-forest-shadow);
    padding: 0 0 14px;
    cursor: pointer;
  }
  .tab.active::after {
    content: "";
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-deep-forest);
  }
  .tab.tab-fav {
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    border: 2px solid var(--color-deep-forest);
    border-radius: var(--radius-buttons);
    padding: 10px 20px;
  }
  .tab.tab-fav.active { background: var(--color-deep-forest); color: var(--color-cream-canvas); }
  .tab.tab-fav.active::after { display: none; }

  .spice-filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 0 0;
  }

  .spice-chip {
    font-family: var(--font-text);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: transparent;
    border: 2px solid var(--color-warm-gray);
    color: var(--color-forest-shadow);
    border-radius: var(--radius-buttons);
    padding: 8px 16px;
    cursor: pointer;
  }
  .spice-chip.active { background: var(--color-deep-forest); border-color: var(--color-deep-forest); color: var(--color-cream-canvas); }

  main { max-width: 1200px; margin: 0 auto; padding: 48px 24px 80px; }

  .category-section { margin-bottom: 48px; }
  .category-section h2 {
    color: var(--color-deep-forest);
    font-size: clamp(28px, 4vw, 40px);
    line-height: 0.9;
    margin-bottom: 24px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 32px;
  }

  .dish-card {
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
  }

  .dish-photo {
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-images);
    background: var(--color-sage-mist);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .dish-photo img { width: 100%; height: 100%; object-fit: cover; }
  .dish-emoji { font-size: 3rem; }

  .fav-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(244, 243, 231, 0.85);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dish-body { padding: 20px 4px 0; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .dish-name { font-family: var(--font-text); font-size: 20px; font-weight: 700; }
  .dish-desc { font-size: 16px; line-height: 1.25; color: var(--color-forest-shadow); flex: 1; }
  .dish-spice { font-size: 0.95rem; }
  .chili-empty { opacity: 0.25; }
  .dish-more {
    font-family: var(--font-text);
    font-size: 16px;
    font-weight: 700;
    color: var(--color-forest-shadow);
    margin-top: 4px;
  }
  .dish-card:hover .dish-more { text-decoration: underline; }
  .dish-category-tag {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--color-deep-forest);
    padding: 0;
    align-self: flex-start;
  }

  .result-card .dish-photo { aspect-ratio: 4 / 3; }

  .empty-state {
    text-align: center;
    color: var(--color-slate-gray);
    padding: 60px 20px;
    font-size: 16px;
  }

  footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--color-cream-canvas);
    background: var(--color-deep-forest);
    font-family: var(--font-text);
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .btn-cta { padding: 14px 26px; font-size: 15px; }
    nav.tabs { gap: 18px; }
  }
</style>
</head>
<body>

<div class="site-nav">
  <span class="brand">ลิ้มรสไทย</span>
</div>

<header class="hero">
  <span class="eyebrow">อาหารไทยแท้ 30 เมนู ครบทุกรสชาติ</span>
  <h1>ลิ้มรสไทย</h1>
  <p class="subtitle">ต้ม ผัด แกง ทอด — กดปุ่มด้านล่างเพื่อสุ่มเมนูเด็ดประจำมื้อนี้</p>
  <button id="spinBtn" class="btn-cta">สุ่มเมนูอาหารไทยวันนี้ →</button>

  <div class="reel hidden" id="reel">
    <div class="reel-track" id="reelTrack">
      <span class="reel-emoji">🍲</span>
      <span class="reel-name">กำลังสุ่ม...</span>
    </div>
    <div class="reel-caption">กำลังลุ้นเมนูเด็ด...</div>
  </div>

  <div id="resultCard" class="hidden"></div>
</header>

<div class="utility-band">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="ค้นหาเมนู เช่น ผัดไทย, กุ้ง, ทอด..." autocomplete="off">
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-filter="all">ทั้งหมด</button>
    <button class="tab" data-filter="ต้ม">ต้ม</button>
    <button class="tab" data-filter="ผัด">ผัด</button>
    <button class="tab" data-filter="แกง">แกง</button>
    <button class="tab" data-filter="ทอด">ทอด</button>
    <button class="tab tab-fav" data-filter="favorites">❤ รายการโปรด</button>
  </nav>

  <div class="spice-filters" id="spiceFilters">
    <button class="spice-chip active" data-spice="all">ทุกระดับความเผ็ด</button>
    <button class="spice-chip" data-spice="1">ไม่เผ็ด</button>
    <button class="spice-chip" data-spice="2">เผ็ดน้อย</button>
    <button class="spice-chip" data-spice="3">เผ็ดกลาง</button>
    <button class="spice-chip" data-spice="45">เผ็ดมาก</button>
  </div>
</div>

<main>
  <section id="catalog"></section>
</main>

<footer>ลิ้มรสไทย — แนะนำอาหารไทยด้วยใจ 🇹🇭</footer>

<script src="js/dishes.js"></script>
<script>
const FAV_KEY = "thaiFoodFavorites";
const CATEGORIES = ["ต้ม", "ผัด", "แกง", "ทอด"];

function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
  catch { return []; }
}

function toggleFavorite(id) {
  const favs = getFavorites();
  const idx = favs.indexOf(id);
  if (idx === -1) favs.push(id); else favs.splice(idx, 1);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {}
  renderCatalog(currentFilter);
  if (currentResultDish) renderResult(currentResultDish, false);
}

function spiceIcons(level) {
  return `<span title="ระดับความเผ็ด ${level}/5">${"🌶️".repeat(level)}<span class="chili-empty">${"🌶️".repeat(5 - level)}</span></span>`;
}

function dishCardHTML(dish) {
  const favs = getFavorites();
  const isFav = favs.includes(dish.id);
  const photoInner = dish.photoUrl
    ? `<img src="${dish.photoUrl}" alt="${dish.name}" loading="lazy" onerror="this.remove();document.getElementById('emoji-${dish.id}').style.display='flex';">`
    : "";
  return `
    <div class="dish-card" data-id="${dish.id}">
      <div class="dish-photo">
        ${photoInner}
        <div class="dish-emoji" id="emoji-${dish.id}" style="${dish.photoUrl ? "display:none" : "display:flex"}">${dish.emoji}</div>
        <button class="fav-btn" data-id="${dish.id}" aria-label="เพิ่มในรายการโปรด">${isFav ? "❤" : "🤍"}</button>
      </div>
      <div class="dish-body">
        <span class="dish-category-tag">${dish.category}</span>
        <div class="dish-name">${dish.name}</div>
        <div class="dish-desc">${dish.description}</div>
        <div class="dish-spice">${spiceIcons(dish.spiceLevel)}</div>
        <div class="dish-more">ดูส่วนประกอบ →</div>
      </div>
    </div>`;
}

let currentFilter = "all";
let currentSearch = "";
let currentSpice = "all";
let currentResultDish = null;

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function matchesSearch(dish) {
  if (!currentSearch) return true;
  return dish.name.toLowerCase().includes(currentSearch)
    || dish.description.toLowerCase().includes(currentSearch)
    || dish.category.toLowerCase().includes(currentSearch);
}

function matchesSpice(dish) {
  if (currentSpice === "all") return true;
  if (currentSpice === "45") return dish.spiceLevel >= 4;
  return dish.spiceLevel === Number(currentSpice);
}

function noMatchMessage(prefix) {
  return currentSearch
    ? `${prefix}ที่ตรงกับคำค้นหา "${escapeHtml(currentSearch)}"`
    : `${prefix}ที่ตรงกับเงื่อนไขที่เลือก`;
}

function renderCatalog(filter) {
  currentFilter = filter;
  const container = document.getElementById("catalog");
  container.innerHTML = "";

  if (filter === "favorites") {
    const favs = getFavorites();
    const favDishes = DISHES.filter(d => favs.includes(d.id) && matchesSearch(d) && matchesSpice(d));
    if (favDishes.length === 0) {
      const msg = favs.length === 0
        ? "ยังไม่มีเมนูโปรด กดหัวใจ 🤍 ที่เมนูที่ชอบเพื่อบันทึกไว้ที่นี่"
        : noMatchMessage("ไม่พบเมนูโปรด");
      container.innerHTML = `<div class="empty-state">${msg}</div>`;
      return;
    }
    const section = document.createElement("section");
    section.className = "category-section";
    section.innerHTML = `<h2>❤ รายการโปรดของฉัน</h2><div class="card-grid">${favDishes.map(dishCardHTML).join("")}</div>`;
    container.appendChild(section);
    return;
  }

  const cats = filter === "all" ? CATEGORIES : [filter];
  let hasResults = false;
  cats.forEach(cat => {
    const dishes = DISHES.filter(d => d.category === cat && matchesSearch(d) && matchesSpice(d));
    if (dishes.length === 0) return;
    hasResults = true;
    const section = document.createElement("section");
    section.className = "category-section";
    section.innerHTML = `<h2>${cat}</h2><div class="card-grid">${dishes.map(dishCardHTML).join("")}</div>`;
    container.appendChild(section);
  });

  if (!hasResults) {
    container.innerHTML = `<div class="empty-state">${noMatchMessage("ไม่พบเมนู")}</div>`;
  }
}

function renderResult(dish, animateIn) {
  currentResultDish = dish;
  const card = document.getElementById("resultCard");
  card.className = "dish-card result-card";
  card.innerHTML = dishCardHTML(dish);
  if (animateIn) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value.trim().toLowerCase();
  renderCatalog(currentFilter);
});

document.getElementById("spiceFilters").addEventListener("click", e => {
  const btn = e.target.closest(".spice-chip");
  if (!btn) return;
  document.querySelectorAll(".spice-chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  currentSpice = btn.dataset.spice;
  renderCatalog(currentFilter);
});

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  renderCatalog(btn.dataset.filter);
});

document.body.addEventListener("click", e => {
  const btn = e.target.closest(".fav-btn");
  if (btn) { toggleFavorite(btn.dataset.id); return; }
  const card = e.target.closest(".dish-card");
  if (card) { window.location.href = `detail.html?id=${encodeURIComponent(card.dataset.id)}`; }
});

const spinBtn = document.getElementById("spinBtn");
const reel = document.getElementById("reel");
const reelTrack = document.getElementById("reelTrack");

spinBtn.addEventListener("click", () => {
  spinBtn.disabled = true;
  document.getElementById("resultCard").classList.add("hidden");
  reel.classList.remove("hidden");

  const finalDish = DISHES[Math.floor(Math.random() * DISHES.length)];
  const intervalMs = 80;
  const totalDuration = 2000;
  const maxTicks = Math.round(totalDuration / intervalMs);
  let ticks = 0;

  const spin = setInterval(() => {
    const randomDish = DISHES[Math.floor(Math.random() * DISHES.length)];
    reelTrack.innerHTML = `<span class="reel-emoji">${randomDish.emoji}</span><span class="reel-name">${randomDish.name}</span>`;
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(spin);
      reelTrack.innerHTML = `<span class="reel-emoji">${finalDish.emoji}</span><span class="reel-name">${finalDish.name}</span>`;
      setTimeout(() => {
        reel.classList.add("hidden");
        document.getElementById("resultCard").classList.remove("hidden");
        renderResult(finalDish, true);
        spinBtn.disabled = false;
      }, 500);
    }
  }, intervalMs);
});

renderCatalog("all");
</script>
</body>
</html>
