<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดเมนู — ลิ้มรสไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@200;300;400;500;600;700&family=Taviraj:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-deep-forest: #00473c;
    --color-lime-glow: #e6ff55;
    --color-sage-mist: #d8e5d6;
    --color-warm-sand: #e8dcc6;
    --color-cream-canvas: #f4f3e7;
    --color-forest-shadow: #0e150e;
    --color-warm-gray: #8c8c82;
    --color-slate-gray: #555555;
    --font-display: 'Mitr', sans-serif;
    --font-accent: 'Taviraj', serif;
    --font-text: 'Mitr', sans-serif;
    --shadow-xl: rgba(14, 21, 14, 0.4) 3px 3px 32px -10px;
    --radius-buttons: 9999px;
    --radius-images: 20px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-cream-canvas);
    color: var(--color-forest-shadow);
    font-family: var(--font-text);
    line-height: 1.5;
  }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; }

  .site-nav {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 24px 0;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--color-deep-forest);
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }

  main { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }

  .detail-photo {
    aspect-ratio: 1 / 1;
    max-height: 420px;
    border-radius: var(--radius-images);
    background: var(--color-sage-mist);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .detail-emoji { font-size: 5rem; }

  .fav-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(244, 243, 231, 0.85);
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dish-category-tag {
    display: block;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--color-deep-forest);
    margin-top: 24px;
  }

  .detail-name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 7vw, 3.2rem);
    line-height: 0.9;
    margin-top: 8px;
    color: var(--color-forest-shadow);
  }

  .detail-spice { font-size: 1.2rem; margin-top: 14px; }
  .chili-empty { opacity: 0.25; }

  .detail-desc {
    font-family: var(--font-accent);
    font-weight: 200;
    margin-top: 18px;
    color: var(--color-forest-shadow);
    font-size: 20px;
    letter-spacing: -0.01em;
  }

  .ingredients-section { margin-top: 48px; }

  .ingredients-section h2 {
    font-family: var(--font-text);
    color: var(--color-deep-forest);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.02em;
    margin-bottom: 20px;
  }

  .ingredients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .ingredients-list li {
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--color-deep-forest);
    background: none;
    border: 2px solid var(--color-deep-forest);
    border-radius: var(--radius-buttons);
    padding: 8px 16px;
  }

  .not-found {
    text-align: center;
    padding: 100px 20px;
    color: var(--color-slate-gray);
  }
  .not-found a { color: var(--color-deep-forest); font-weight: 700; text-decoration: none; }
  .not-found a:hover { text-decoration: underline; }

  footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--color-cream-canvas);
    background: var(--color-deep-forest);
    font-family: var(--font-text);
    font-size: 14px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="site-nav">
  <a class="back-link" href="index.html">← กลับหน้ารายการเมนู</a>
</div>

<main id="main"></main>

<footer>ลิ้มรสไทย — แนะนำอาหารไทยด้วยใจ 🇹🇭</footer>

<script src="js/dishes.js"></script>
<script>
const FAV_KEY = "thaiFoodFavorites";

function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
  catch { return []; }
}

function toggleFavorite(id) {
  const favs = getFavorites();
  const idx = favs.indexOf(id);
  if (idx === -1) favs.push(id); else favs.splice(idx, 1);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {}
  render();
}

function spiceIcons(level) {
  return `<span title="ระดับความเผ็ด ${level}/5">${"🌶️".repeat(level)}<span class="chili-empty">${"🌶️".repeat(5 - level)}</span></span>`;
}

function getDishId() {
  return new URLSearchParams(window.location.search).get("id");
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function render() {
  const main = document.getElementById("main");
  const dish = DISHES.find(d => d.id === getDishId());

  if (!dish) {
    main.innerHTML = `<div class="not-found"><p>ไม่พบเมนูที่ต้องการ</p><a href="index.html">← กลับหน้ารายการเมนู</a></div>`;
    document.title = "ไม่พบเมนู — ลิ้มรสไทย";
    return;
  }

  document.title = `${dish.name} — ลิ้มรสไทย`;

  const isFav = getFavorites().includes(dish.id);
  const photoInner = dish.photoUrl
    ? `<img src="${dish.photoUrl}" alt="${dish.name}" onerror="this.remove();document.getElementById('detail-emoji').style.display='flex';">`
    : "";

  const ingredientsHTML = (dish.ingredients || [])
    .map(item => `<li>${escapeHtml(item)}</li>`)
    .join("");

  main.innerHTML = `
    <div class="detail-photo">
      ${photoInner}
      <div class="detail-emoji" id="detail-emoji" style="${dish.photoUrl ? "display:none" : "display:flex"}">${dish.emoji}</div>
      <button class="fav-btn" id="favBtn" aria-label="เพิ่มในรายการโปรด">${isFav ? "❤" : "🤍"}</button>
    </div>
    <span class="dish-category-tag">${dish.category}</span>
    <h1 class="detail-name">${dish.name}</h1>
    <div class="detail-spice">${spiceIcons(dish.spiceLevel)}</div>
    <p class="detail-desc">${dish.description}</p>
    <section class="ingredients-section">
      <h2>ส่วนประกอบ</h2>
      <ul class="ingredients-list">${ingredientsHTML}</ul>
    </section>
  `;

  document.getElementById("favBtn").addEventListener("click", () => toggleFavorite(dish.id));
}

render();
</script>
</body>
</html>
