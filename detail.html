<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดเมนู — ลิ้มรสไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Taviraj:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf3e4;
    --cream-dark: #f1e2c3;
    --gold: #c9a24d;
    --gold-deep: #9c7a2e;
    --teal: #0f6e66;
    --teal-deep: #0a4b45;
    --text: #3b2b1a;
    --maroon: #8b3a3a;
    --card-shadow: 0 6px 18px rgba(59, 43, 26, 0.15);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--text);
    font-family: 'Mitr', sans-serif;
    line-height: 1.6;
  }

  h1, h2, h3 { font-family: 'Taviraj', serif; margin: 0; }

  .thai-divider {
    height: 14px;
    background:
      linear-gradient(135deg, var(--gold) 25%, transparent 25%) 0 0 / 16px 16px,
      linear-gradient(225deg, var(--gold) 25%, transparent 25%) 0 0 / 16px 16px;
    background-color: var(--teal-deep);
  }

  header.hero {
    background: linear-gradient(180deg, var(--teal-deep), var(--teal));
    color: var(--cream);
    padding: 20px 20px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--gold);
    text-decoration: none;
    font-size: 0.95rem;
  }
  .back-link:hover { text-decoration: underline; }

  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }

  .detail-photo {
    height: 260px;
    border-radius: 18px;
    background: var(--cream-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    position: relative;
  }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .detail-emoji { font-size: 5rem; }

  .fav-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.85);
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dish-category-tag {
    font-size: 0.8rem;
    color: var(--teal-deep);
    background: var(--cream-dark);
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    margin-top: 18px;
  }

  .detail-name {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 600;
    margin-top: 8px;
  }

  .detail-spice { font-size: 1.2rem; margin-top: 6px; }
  .chili-empty { opacity: 0.2; }

  .detail-desc {
    margin-top: 12px;
    color: #5a4a35;
    font-size: 1rem;
  }

  .ingredients-section {
    margin-top: 28px;
    background: #fff;
    border: 1px solid var(--cream-dark);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: var(--card-shadow);
  }

  .ingredients-section h2 {
    color: var(--maroon);
    border-bottom: 2px solid var(--gold);
    display: inline-block;
    padding-bottom: 4px;
    margin-bottom: 14px;
    font-size: 1.2rem;
  }

  .ingredients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .ingredients-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    background: var(--cream);
    border: 1px solid var(--cream-dark);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .ingredients-list li::before { content: "🌿"; font-size: 0.9rem; }

  .not-found {
    text-align: center;
    padding: 60px 20px;
    color: var(--gold-deep);
  }
  .not-found a { color: var(--teal); }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--cream-dark);
    background: var(--teal-deep);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header class="hero">
  <a class="back-link" href="index.html">← กลับหน้ารายการเมนู</a>
</header>

<div class="thai-divider"></div>

<main id="main"></main>

<footer>ลิ้มรสไทย — แนะนำอาหารไทยด้วยใจ 🇹🇭</footer>

<script src="js/dishes.js"></script>
<script>
const FAV_KEY = "thaiFoodFavorites";

function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
  catch { return []; }
}

function toggleFavorite(id) {
  const favs = getFavorites();
  const idx = favs.indexOf(id);
  if (idx === -1) favs.push(id); else favs.splice(idx, 1);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {}
  render();
}

function spiceIcons(level) {
  return `<span title="ระดับความเผ็ด ${level}/5">${"🌶️".repeat(level)}<span class="chili-empty">${"🌶️".repeat(5 - level)}</span></span>`;
}

function getDishId() {
  return new URLSearchParams(window.location.search).get("id");
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function render() {
  const main = document.getElementById("main");
  const dish = DISHES.find(d => d.id === getDishId());

  if (!dish) {
    main.innerHTML = `<div class="not-found"><p>ไม่พบเมนูที่ต้องการ</p><a href="index.html">← กลับหน้ารายการเมนู</a></div>`;
    document.title = "ไม่พบเมนู — ลิ้มรสไทย";
    return;
  }

  document.title = `${dish.name} — ลิ้มรสไทย`;

  const isFav = getFavorites().includes(dish.id);
  const photoInner = dish.photoUrl
    ? `<img src="${dish.photoUrl}" alt="${dish.name}" onerror="this.remove();document.getElementById('detail-emoji').style.display='flex';">`
    : "";

  const ingredientsHTML = (dish.ingredients || [])
    .map(item => `<li>${escapeHtml(item)}</li>`)
    .join("");

  main.innerHTML = `
    <div class="detail-photo">
      ${photoInner}
      <div class="detail-emoji" id="detail-emoji" style="${dish.photoUrl ? "display:none" : "display:flex"}">${dish.emoji}</div>
      <button class="fav-btn" id="favBtn" aria-label="เพิ่มในรายการโปรด">${isFav ? "❤" : "🤍"}</button>
    </div>
    <span class="dish-category-tag">${dish.category}</span>
    <h1 class="detail-name">${dish.name}</h1>
    <div class="detail-spice">${spiceIcons(dish.spiceLevel)}</div>
    <p class="detail-desc">${dish.description}</p>
    <section class="ingredients-section">
      <h2>ส่วนประกอบ</h2>
      <ul class="ingredients-list">${ingredientsHTML}</ul>
    </section>
  `;

  document.getElementById("favBtn").addEventListener("click", () => toggleFavorite(dish.id));
}

render();
</script>
</body>
</html>
